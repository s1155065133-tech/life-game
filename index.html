<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>人生遊戲化 Gamified Life</title>

    <!-- 📱 iOS 標準 Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/color/512/crossed-swords.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/512/crossed-swords.png">

    <!-- Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 75px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* 頂部英雄面板 */
        header {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            padding: 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-gold), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .user-info h2 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .level-badge {
            background: var(--accent-gold);
            color: #000;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .stats-bar {
            margin-top: 10px;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .progress-bg {
            background: rgba(255, 255, 255, 0.1);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            width: 0%;
            transition: width 0.3s ease;
        }

        .currencies {
            display: flex;
            gap: 15px;
            margin-top: 12px;
            font-weight: bold;
            font-size: 14px;
        }

        .currency-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 10px;
            border-radius: 10px;
        }

        /* 底部導覽列 */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid var(--card-border);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            font-size: 10px;
            background: none;
            border: none;
            cursor: pointer;
            width: 14%;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: bold;
        }

        .nav-icon {
            font-size: 18px;
            margin-bottom: 2px;
        }

        /* 主要內容區 */
        main {
            padding: 0 15px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 按鈕與輸入框 */
        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: var(--text-main);
            margin-bottom: 10px;
            font-size: 14px;
        }

        button.btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button.btn-success {
            background: var(--accent-green);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button.btn-danger {
            background: var(--accent-red);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 12px;
            width: auto;
            margin: 0 2px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn-edit { background: var(--accent-gold); color: #000; }
        .btn-delete { background: var(--accent-red); color: #fff; }

        /* 列表樣式 */
        .quest-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 4px solid var(--primary);
        }

        .quest-info h4 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .quest-tags {
            display: flex;
            gap: 5px;
            font-size: 11px;
        }

        .tag {
            background: var(--card-border);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-sub);
        }

        .btn-complete {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: auto;
            margin: 0;
        }

        .attr-item { margin-bottom: 12px; }
        .attr-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .chart-container {
            position: relative;
            height: 220px;
            width: 100%;
            margin-top: 10px;
        }

        .history-list-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--card-border);
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .finance-summary {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        .finance-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }

        .finance-box .num {
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
        }

        .month-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .month-selector label {
            font-size: 13px;
            color: var(--text-sub);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- 頂部英雄面板 -->
    <header>
        <div class="user-profile">
            <div class="avatar">⚔️</div>
            <div class="user-info">
                <h2><span id="player-name">冒險者</span> <span class="level-badge" id="player-level">LV.1</span></h2>
                <div class="currencies">
                    <div class="currency-item">🪙 <span id="player-gold">0</span> 金幣</div>
                </div>
            </div>
        </div>
        <div class="stats-bar">
            <div class="bar-label">
                <span>經驗值 EXP</span>
                <span id="exp-text">0 / 100</span>
            </div>
            <div class="progress-bg">
                <div class="progress-fill" id="exp-bar"></div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main>
        <!-- 1. 任務與冒險頁面 -->
        <section id="tab-quests" class="tab-content active">
            <div class="card">
                <div class="card-title"><span id="quest-form-title">➕ 發布新任務</span></div>
                <input type="text" id="quest-title" placeholder="任務名稱 (例: 練習桌遊設計30分鐘)">
                <div style="display: flex; gap: 8px;">
                    <select id="quest-attr"></select>
                    <input type="number" id="quest-exp" placeholder="EXP (預設20)" value="20">
                    <input type="number" id="quest-gold" placeholder="金幣 (預設10)" value="10">
                </div>
                <button class="btn-primary" id="btn-save-quest" onclick="addOrUpdateQuest()">新增任務</button>
            </div>

            <div class="card">
                <div class="card-title">📜 每日任務清單</div>
                <div id="quest-list"></div>
            </div>
        </section>

        <!-- 2. 個人屬性與能力矩陣 -->
        <section id="tab-stats" class="tab-content">
            <div class="card">
                <div class="card-title">✨ 自訂能力矩陣</div>
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <input type="text" id="new-attr-name" placeholder="新增能力 (如: 閱讀)" style="margin:0;">
                    <button class="btn-primary" onclick="addCustomAttribute()" style="width: 30%; margin:0;">新增</button>
                </div>
                <div id="attributes-list"></div>
            </div>
        </section>

        <!-- 3. 冒險日誌 -->
        <section id="tab-log" class="tab-content">
            <div class="card">
                <div class="card-title">📅 選擇查看日期</div>
                <input type="date" id="log-date-picker" onchange="loadHistoryLog()">
            </div>
            <div class="card">
                <div class="card-title">✅ 當日完成任務紀錄</div>
                <div id="history-task-list"></div>
            </div>
            <div class="card">
                <div class="card-title">📝 每日冒險心得 / 檢討</div>
                <textarea id="daily-note" rows="4" placeholder="寫下今天的收穫或改進的地方..."></textarea>
                <button class="btn-primary" onclick="saveDailyNote()">儲存心得</button>
            </div>
        </section>

        <!-- 4. 體重與飲食追蹤 -->
        <section id="tab-weight" class="tab-content">
            <div class="card">
                <div class="card-title">⚖️ 記錄體重與每日飲食</div>
                <input type="number" id="weight-input" step="0.1" placeholder="今日體重 (kg)">
                <textarea id="diet-input" rows="2" placeholder="今日飲食備忘 (例: 早餐: 麥片 / 午餐: 雞肉沙拉)"></textarea>
                <button class="btn-primary" onclick="addWeightRecord()">記錄健康數據</button>
            </div>

            <div class="card">
                <div class="card-title">📈 月份健康走勢</div>
                <div class="month-selector">
                    <label>查看月份：</label>
                    <input type="month" id="weight-month-picker" onchange="renderWeightTab()">
                </div>
                <div class="chart-container">
                    <canvas id="weightChart"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-title">🥗 當月飲食與體重明細</div>
                <div id="weight-history-list"></div>
            </div>
        </section>

        <!-- 5. 閱讀筆記 -->
        <section id="tab-reading" class="tab-content">
            <div class="card">
                <div class="card-title">📚 登記閱讀書籍</div>
                <input type="text" id="book-title" placeholder="書名 (例: 原子習慣)">
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="book-rating" min="1" max="10" placeholder="評分 (1-10分)" style="width: 40%;">
                    <input type="date" id="book-date" style="width: 60%;">
                </div>
                <textarea id="book-note" rows="2" placeholder="簡短閱讀心得..."></textarea>
                <button class="btn-primary" onclick="addBookRecord()">新增書籍紀錄</button>
            </div>

            <div class="card">
                <div class="card-title">📖 月份閱讀書單</div>
                <div class="month-selector">
                    <label>查看月份：</label>
                    <input type="month" id="reading-month-picker" onchange="renderReadingTab()">
                </div>
                <div id="reading-list"></div>
            </div>
        </section>

        <!-- 6. 財務管理 -->
        <section id="tab-finance" class="tab-content">
            <div class="card">
                <div class="month-selector">
                    <label>查看月份：</label>
                    <input type="month" id="finance-month-picker" onchange="renderFinanceTab()">
                </div>
                <div class="finance-summary">
                    <div class="finance-box">
                        <div style="font-size:11px; color:var(--text-sub);">當月結餘</div>
                        <div class="num" id="net-asset" style="color:var(--accent-gold);">$0</div>
                    </div>
                    <div class="finance-box">
                        <div style="font-size:11px; color:var(--text-sub);">當月收入</div>
                        <div class="num" id="total-income" style="color:var(--accent-green);">$0</div>
                    </div>
                    <div class="finance-box">
                        <div style="font-size:11px; color:var(--text-sub);">當月支出</div>
                        <div class="num" id="total-expense" style="color:var(--accent-red);">$0</div>
                    </div>
                </div>

                <div class="card-title">💰 新增收支明細</div>
                <div style="display: flex; gap: 8px;">
                    <select id="fin-type" style="width:30%;">
                        <option value="expense">支出 🔴</option>
                        <option value="income">收入 🟢</option>
                    </select>
                    <input type="text" id="fin-cat" placeholder="類別 (如: 餐飲)" style="width:40%;">
                    <input type="number" id="fin-amount" placeholder="金額" style="width:30%;">
                </div>
                <button class="btn-primary" onclick="addFinanceRecord()">新增紀錄</button>
            </div>

            <div class="card">
                <div class="card-title">📊 當月支出類別占比</div>
                <div class="chart-container">
                    <canvas id="financeChart"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📋 當月收支明細表</div>
                <div id="finance-history-list"></div>
            </div>
        </section>

        <!-- 7. 系統設定頁面 -->
        <section id="tab-settings" class="tab-content">
            <div class="card">
                <div class="card-title">👤 個人設定</div>
                <label style="font-size:12px; color:var(--text-sub); display:block; margin-bottom:4px;">修改冒險者名稱：</label>
                <input type="text" id="setting-name-input" placeholder="輸入你的稱號或名字">
                <button class="btn-primary" onclick="updateName()">儲存名字</button>
            </div>

            <div class="card">
                <div class="card-title">💾 資料備份與匯入</div>
                <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 10px;">將所有紀錄匯出備份檔案，或將備份檔匯入以還原/同步資料。</p>
                <button class="btn-success" onclick="exportData()" style="margin-bottom: 8px;">📤 匯出備份檔案 (.json)</button>
                
                <label style="font-size:12px; color:var(--text-sub); display:block; margin-top:6px; margin-bottom:4px;">選擇備份檔匯入：</label>
                <input type="file" id="import-file-input" accept=".json" onchange="importData(event)">
            </div>

            <div class="card" style="border-color: rgba(239, 68, 68, 0.4);">
                <div class="card-title" style="color: var(--accent-red);">⚠️ 重置資料</div>
                <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 12px;">重置後將清空所有等級、經驗值、任務紀錄、體重與財務數據，且無法復原。</p>
                <button class="btn-danger" onclick="resetAllData()">清空並重置所有資料</button>
            </div>
        </section>
    </main>

    <!-- 底部導覽列 -->
    <nav>
        <button class="nav-item active" onclick="switchTab('quests', this)">
            <span class="nav-icon">⚔️</span>冒險
        </button>
        <button class="nav-item" onclick="switchTab('stats', this)">
            <span class="nav-icon">📊</span>屬性
        </button>
        <button class="nav-item" onclick="switchTab('log', this)">
            <span class="nav-icon">📖</span>日誌
        </button>
        <button class="nav-item" onclick="switchTab('weight', this)">
            <span class="nav-icon">⚖️</span>體重
        </button>
        <button class="nav-item" onclick="switchTab('reading', this)">
            <span class="nav-icon">📚</span>閱讀
        </button>
        <button class="nav-item" onclick="switchTab('finance', this)">
            <span class="nav-icon">💰</span>財務
        </button>
        <button class="nav-item" onclick="switchTab('settings', this)">
            <span class="nav-icon">⚙️</span>設定
        </button>
    </nav>

    <script>
        const defaultData = {
            name: "冒險者",
            level: 1,
            exp: 0,
            gold: 0,
            attributes: {
                "體力健康": 0,
                "智力知識": 0,
                "音樂": 0,
                "桌遊知識": 0,
                "桌遊設計": 0,
                "桌遊課程設計": 0,
                "語文能力": 0,
                "閱讀": 0
            },
            quests: [],
            history: {},
            weightLogs: [],
            readingLogs: [],
            financeLogs: []
        };

        let gameData = JSON.parse(localStorage.getItem('lifeGamifyData')) || JSON.parse(JSON.stringify(defaultData));

        let editingQuestId = null;
        let weightChartInstance = null;
        let financeChartInstance = null;

        const currentMonthStr = new Date().toISOString().slice(0, 7);

        window.onload = function() {
            document.getElementById('log-date-picker').value = new Date().toISOString().split('T')[0];
            document.getElementById('book-date').value = new Date().toISOString().split('T')[0];
            
            document.getElementById('weight-month-picker').value = currentMonthStr;
            document.getElementById('reading-month-picker').value = currentMonthStr;
            document.getElementById('finance-month-picker').value = currentMonthStr;

            updateUI();
            initCharts();
        };

        function saveData() {
            localStorage.setItem('lifeGamifyData', JSON.stringify(gameData));
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            btn.classList.add('active');

            if (tabId === 'weight') renderWeightTab();
            if (tabId === 'reading') renderReadingTab();
            if (tabId === 'finance') renderFinanceTab();
            if (tabId === 'log') loadHistoryLog();
            if (tabId === 'settings') {
                document.getElementById('setting-name-input').value = gameData.name || "冒險者";
            }
        }

        function updateUI() {
            const maxExp = gameData.level * 100;
            document.getElementById('player-name').innerText = gameData.name || "冒險者";
            document.getElementById('player-level').innerText = `LV.${gameData.level}`;
            document.getElementById('player-gold').innerText = gameData.gold;
            document.getElementById('exp-text').innerText = `${gameData.exp} / ${maxExp}`;
            document.getElementById('exp-bar').style.width = `${(gameData.exp / maxExp) * 100}%`;

            const attrSelect = document.getElementById('quest-attr');
            attrSelect.innerHTML = '';
            for (let attr in gameData.attributes) {
                attrSelect.innerHTML += `<option value="${attr}">${attr}</option>`;
            }

            const attrList = document.getElementById('attributes-list');
            attrList.innerHTML = '';
            for (let attr in gameData.attributes) {
                const val = gameData.attributes[attr];
                attrList.innerHTML += `
                    <div class="attr-item">
                        <div class="attr-header">
                            <span>${attr}</span>
                            <span><strong>${val}</strong> PTS</span>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width: ${Math.min(val, 100)}%; background: linear-gradient(90deg, #10b981, #6366f1);"></div>
                        </div>
                    </div>
                `;
            }

            const questList = document.getElementById('quest-list');
            questList.innerHTML = '';
            if (gameData.quests.length === 0) {
                questList.innerHTML = '<p style="color:var(--text-sub); font-size:13px;">目前沒有任務，請在上方新增！</p>';
            } else {
                gameData.quests.forEach(q => {
                    questList.innerHTML += `
                        <div class="quest-item">
                            <div class="quest-info">
                                <h4>${q.title}</h4>
                                <div class="quest-tags">
                                    <span class="tag">${q.attr}</span>
                                    <span class="tag">+${q.exp} EXP</span>
                                    <span class="tag">🪙 +${q.gold}</span>
                                </div>
                            </div>
                            <div>
                                <button class="btn-complete" onclick="completeQuest(${q.id})">完成</button>
                                <button class="btn-small btn-edit" onclick="editQuest(${q.id})">✏️</button>
                                <button class="btn-small btn-delete" onclick="deleteQuest(${q.id})">🗑️</button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function addOrUpdateQuest() {
            const title = document.getElementById('quest-title').value.trim();
            const attr = document.getElementById('quest-attr').value;
            const exp = parseInt(document.getElementById('quest-exp').value) || 20;
            const gold = parseInt(document.getElementById('quest-gold').value) || 10;

            if (!title) return alert('請輸入任務名稱！');

            if (editingQuestId !== null) {
                const q = gameData.quests.find(item => item.id === editingQuestId);
                if (q) {
                    q.title = title;
                    q.attr = attr;
                    q.exp = exp;
                    q.gold = gold;
                }
                editingQuestId = null;
                document.getElementById('quest-form-title').innerText = '➕ 發布新任務';
                document.getElementById('btn-save-quest').innerText = '新增任務';
            } else {
                gameData.quests.push({ id: Date.now(), title, attr, exp, gold });
            }

            document.getElementById('quest-title').value = '';
            saveData();
            updateUI();
        }

        function editQuest(id) {
            const q = gameData.quests.find(item => item.id === id);
            if (!q) return;

            document.getElementById('quest-title').value = q.title;
            document.getElementById('quest-attr').value = q.attr;
            document.getElementById('quest-exp').value = q.exp;
            document.getElementById('quest-gold').value = q.gold;

            editingQuestId = id;
            document.getElementById('quest-form-title').innerText = '✏️ 編輯任務';
            document.getElementById('btn-save-quest').innerText = '更新任務';
        }

        function deleteQuest(id) {
            if (confirm('確定要刪除這個任務嗎？')) {
                gameData.quests = gameData.quests.filter(q => q.id !== id);
                saveData();
                updateUI();
            }
        }

        function completeQuest(id) {
            const index = gameData.quests.findIndex(q => q.id === id);
            if (index === -1) return;

            const quest = gameData.quests[index];
            gameData.exp += quest.exp;
            gameData.gold += quest.gold;
            
            if (gameData.attributes[quest.attr] !== undefined) {
                gameData.attributes[quest.attr] += 1;
            }

            const maxExp = gameData.level * 100;
            if (gameData.exp >= maxExp) {
                gameData.level += 1;
                gameData.exp -= maxExp;
                alert(`🎉 恭喜！你升到了 LV.${gameData.level}！`);
            }

            const today = new Date().toISOString().split('T')[0];
            if (!gameData.history[today]) {
                gameData.history[today] = { tasks: [], note: "" };
            }
            gameData.history[today].tasks.push({
                title: quest.title,
                attr: quest.attr,
                completedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            gameData.quests.splice(index, 1);
            saveData();
            updateUI();
        }

        function addCustomAttribute() {
            const name = document.getElementById('new-attr-name').value.trim();
            if (!name) return alert('請輸入能力名稱！');
            if (gameData.attributes[name] !== undefined) return alert('該能力已經存在！');

            gameData.attributes[name] = 0;
            document.getElementById('new-attr-name').value = '';
            saveData();
            updateUI();
        }

        function loadHistoryLog() {
            const selectedDate = document.getElementById('log-date-picker').value;
            const logContainer = document.getElementById('history-task-list');
            const noteTextarea = document.getElementById('daily-note');
            const dayData = gameData.history[selectedDate] || { tasks: [], note: "" };

            logContainer.innerHTML = '';
            if (dayData.tasks.length === 0) {
                logContainer.innerHTML = '<p style="color:var(--text-sub); font-size:13px;">這天沒有完成任何任務。</p>';
            } else {
                dayData.tasks.forEach(t => {
                    logContainer.innerHTML += `
                        <div class="history-list-item">
                            <span>✅ ${t.title} (${t.attr})</span>
                            <span style="color:var(--text-sub);">${t.completedAt || ''}</span>
                        </div>
                    `;
                });
            }
            noteTextarea.value = dayData.note || "";
        }

        function saveDailyNote() {
            const selectedDate = document.getElementById('log-date-picker').value;
            const note = document.getElementById('daily-note').value;
            if (!gameData.history[selectedDate]) {
                gameData.history[selectedDate] = { tasks: [], note: "" };
            }
            gameData.history[selectedDate].note = note;
            saveData();
            alert('📝 日誌心得已成功儲存！');
        }

        function addWeightRecord() {
            const weight = parseFloat(document.getElementById('weight-input').value);
            const diet = document.getElementById('diet-input').value.trim();
            if (!weight) return alert('請輸入有效體重！');

            const today = new Date().toISOString().split('T')[0];
            const existingIndex = gameData.weightLogs.findIndex(w => w.date === today);

            if (existingIndex >= 0) {
                gameData.weightLogs[existingIndex].weight = weight;
                gameData.weightLogs[existingIndex].diet = diet;
            } else {
                gameData.weightLogs.push({ id: Date.now(), date: today, weight, diet });
            }

            gameData.weightLogs.sort((a, b) => new Date(a.date) - new Date(b.date));
            document.getElementById('weight-input').value = '';
            document.getElementById('diet-input').value = '';

            saveData();
            renderWeightTab();
        }

        function deleteWeightRecord(id) {
            if (confirm('確定要刪除這筆體重紀錄嗎？')) {
                gameData.weightLogs = gameData.weightLogs.filter(w => w.id !== id);
                saveData();
                renderWeightTab();
            }
        }

        function renderWeightTab() {
            const selectedMonth = document.getElementById('weight-month-picker').value;
            const filteredLogs = gameData.weightLogs.filter(w => w.date.startsWith(selectedMonth));

            if (weightChartInstance) {
                weightChartInstance.data.labels = filteredLogs.map(item => item.date.slice(8) + '日');
                weightChartInstance.data.datasets[0].data = filteredLogs.map(item => item.weight);
                weightChartInstance.update();
            }

            const listEl = document.getElementById('weight-history-list');
            listEl.innerHTML = '';
            if (filteredLogs.length === 0) {
                listEl.innerHTML = '<p style="color:var(--text-sub); font-size:13px;">當月無紀錄。</p>';
            } else {
                filteredLogs.forEach(item => {
                    listEl.innerHTML += `
                        <div class="history-list-item">
                            <div>
                                <strong>${item.date}</strong>: ${item.weight} kg
                                ${item.diet ? `<div style="font-size:12px; color:var(--text-sub); margin-top:2px;">🥗 ${item.diet}</div>` : ''}
                            </div>
                            <button class="btn-small btn-delete" onclick="deleteWeightRecord(${item.id})">🗑️</button>
                        </div>
                    `;
                });
            }
        }

        function addBookRecord() {
            const title = document.getElementById('book-title').value.trim();
            const rating = parseInt(document.getElementById('book-rating').value);
            const date = document.getElementById('book-date').value;
            const note = document.getElementById('book-note').value.trim();

            if (!title) return alert('請輸入書名！');
            if (!rating || rating < 1 || rating > 10) return alert('請輸入 1-10 分的評分！');

            gameData.readingLogs.push({ id: Date.now(), date, title, rating, note });
            
            if (gameData.attributes['閱讀'] !== undefined) {
                gameData.attributes['閱讀'] += 1;
            }
            gameData.exp += 15;

            document.getElementById('book-title').value = '';
            document.getElementById('book-rating').value = '';
            document.getElementById('book-note').value = '';

            saveData();
            updateUI();
            renderReadingTab();
        }

        function deleteBookRecord(id) {
            if (confirm('確定要刪除這筆閱讀紀錄嗎？')) {
                gameData.readingLogs = gameData.readingLogs.filter(b => b.id !== id);
                saveData();
                renderReadingTab();
            }
        }

        function renderReadingTab() {
            const selectedMonth = document.getElementById('reading-month-picker').value;
            const filteredLogs = gameData.readingLogs.filter(b => b.date.startsWith(selectedMonth));

            const listEl = document.getElementById('reading-list');
            listEl.innerHTML = '';

            if (filteredLogs.length === 0) {
                listEl.innerHTML = '<p style="color:var(--text-sub); font-size:13px;">當月尚無閱讀紀錄。</p>';
            } else {
                filteredLogs.forEach(b => {
                    listEl.innerHTML += `
                        <div class="history-list-item" style="flex-direction: column; align-items: flex-start;">
                            <div style="display:flex; justify-content:space-between; width:100%;">
                                <strong>📖 ${b.title}</strong>
                                <div>
                                    <span style="color:var(--accent-gold); font-weight:bold;">★ ${b.rating}/10</span>
                                    <button class="btn-small btn-delete" onclick="deleteBookRecord(${b.id})">🗑️</button>
                                </div>
                            </div>
                            <div style="font-size:12px; color:var(--text-sub); margin-top:4px;">
                                日期: ${b.date} ${b.note ? `| 心得: ${b.note}` : ''}
                            </div>
                        </div>
                    `;
                });
            }
        }

        function addFinanceRecord() {
            const type = document.getElementById('fin-type').value;
            const cat = document.getElementById('fin-cat').value.trim() || '未分類';
            const amount = parseFloat(document.getElementById('fin-amount').value);

            if (!amount) return alert('請輸入有效金額！');

            const today = new Date().toISOString().split('T')[0];
            gameData.financeLogs.push({ id: Date.now(), date: today, type, cat, amount });

            document.getElementById('fin-cat').value = '';
            document.getElementById('fin-amount').value = '';
            saveData();
            renderFinanceTab();
        }

        function deleteFinanceRecord(id) {
            if (confirm('確定要刪除這筆財務明細嗎？')) {
                gameData.financeLogs = gameData.financeLogs.filter(f => f.id !== id);
                saveData();
                renderFinanceTab();
            }
        }

        function renderFinanceTab() {
            const selectedMonth = document.getElementById('finance-month-picker').value;
            const filteredLogs = gameData.financeLogs.filter(f => f.date.startsWith(selectedMonth));

            let totalIncome = 0;
            let totalExpense = 0;
            const expenseByCat = {};

            filteredLogs.forEach(item => {
                if (item.type === 'income') {
                    totalIncome += item.amount;
                } else {
                    totalExpense += item.amount;
                    expenseByCat[item.cat] = (expenseByCat[item.cat] || 0) + item.amount;
                }
            });

            document.getElementById('net-asset').innerText = `$${totalIncome - totalExpense}`;
            document.getElementById('total-income').innerText = `$${totalIncome}`;
            document.getElementById('total-expense').innerText = `$${totalExpense}`;

            if (financeChartInstance) {
                financeChartInstance.data.labels = Object.keys(expenseByCat);
                financeChartInstance.data.datasets[0].data = Object.values(expenseByCat);
                financeChartInstance.update();
            }

            const listEl = document.getElementById('finance-history-list');
            listEl.innerHTML = '';
            if (filteredLogs.length === 0) {
                listEl.innerHTML = '<p style="color:var(--text-sub); font-size:13px;">當月無收支紀錄。</p>';
            } else {
                filteredLogs.forEach(f => {
                    const isInc = f.type === 'income';
                    listEl.innerHTML += `
                        <div class="history-list-item">
                            <div>
                                <span>${f.date} [${f.cat}]</span>
                                <span style="font-weight:bold; color:${isInc ? 'var(--accent-green)' : 'var(--accent-red)'}; margin-left:8px;">
                                    ${isInc ? '+' : '-'}$${f.amount}
                                </span>
                            </div>
                            <button class="btn-small btn-delete" onclick="deleteFinanceRecord(${f.id})">🗑️</button>
                        </div>
                    `;
                });
            }
        }

        // 設定：修改名字
        function updateName() {
            const newName = document.getElementById('setting-name-input').value.trim();
            if (!newName) return alert('請輸入有效的名稱！');
            gameData.name = newName;
            saveData();
            updateUI();
            alert('👤 稱號修改成功！');
        }

        // 📤 匯出資料為 JSON 檔案
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(gameData, null, 2));
            const downloadAnchor = document.createElement('a');
            const fileName = `GamifiedLife_Backup_${new Date().toISOString().split('T')[0]}.json`;
            
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", fileName);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // 📥 匯入 JSON 檔案並覆蓋資料
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && imported.level !== undefined && imported.attributes !== undefined) {
                        gameData = imported;
                        saveData();
                        updateUI();
                        renderWeightTab();
                        renderReadingTab();
                        renderFinanceTab();
                        alert('📥 備份資料已成功匯入並同步！');
                    } else {
                        alert('❌ 檔案格式不符合，請確認是否為正確的備份檔！');
                    }
                } catch (err) {
                    alert('❌ 讀取檔案失敗，請檢查檔案格式。');
                }
            };
            reader.readAsText(file);
        }

        // 設定：重置資料
        function resetAllData() {
            if (confirm('⚠️ 確定要重置所有資料嗎？這將會清空等級、任務、體重、閱讀與財務紀錄！')) {
                gameData = JSON.parse(JSON.stringify(defaultData));
                saveData();
                updateUI();
                renderWeightTab();
                renderReadingTab();
                renderFinanceTab();
                alert('🔄 資料已完全重置！');
            }
        }

        function initCharts() {
            const ctxW = document.getElementById('weightChart').getContext('2d');
            weightChartInstance = new Chart(ctxW, {
                type: 'line',
                data: { labels: [], datasets: [{ label: '體重 (kg)', data: [], borderColor: '#10b981', tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctxF = document.getElementById('financeChart').getContext('2d');
            financeChartInstance = new Chart(ctxF, {
                type: 'doughnut',
                data: { labels: [], datasets: [{ data: [], backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#10b981', '#8b5cf6'] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    </script>
</body>
</html>
