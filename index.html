<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>人生遊戲化 Gamified Life</title>

    <!-- 📱 iOS 標準 Apple Touch Icon (標準高畫質 PNG) -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/color/512/crossed-swords.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/512/crossed-swords.png">

    <!-- Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* 頂部英雄面板 */
        header {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            padding: 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-gold), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .user-info h2 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .level-badge {
            background: var(--accent-gold);
            color: #000;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .stats-bar {
            margin-top: 10px;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .progress-bg {
            background: rgba(255, 255, 255, 0.1);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            width: 0%;
            transition: width 0.3s ease;
        }

        .currencies {
            display: flex;
            gap: 15px;
            margin-top: 12px;
            font-weight: bold;
            font-size: 14px;
        }

        .currency-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 10px;
            border-radius: 10px;
        }

        /* 導覽列 */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--card-border);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            font-size: 11px;
            background: none;
            border: none;
            cursor: pointer;
            width: 16%;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: bold;
        }

        .nav-icon {
            font-size: 18px;
            margin-bottom: 2px;
        }

        /* 主要內容區 */
        main {
            padding: 0 15px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 按鈕與輸入框 */
        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: var(--text-main);
            margin-bottom: 10px;
            font-size: 14px;
        }

        button.btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button.btn-danger {
            background: var(--accent-red);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        /* 任務列表 */
        .quest-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 4px solid var(--primary);
        }

        .quest-info h4 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .quest-tags {
            display: flex;
            gap: 5px;
            font-size: 11px;
        }

        .tag {
            background: var(--card-border);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-sub);
        }

        .btn-complete {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: auto;
            margin: 0;
        }

        /* 屬性清單 */
        .attr-item {
            margin-bottom: 12px;
        }

        .attr-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 4px;
        }

        /* 歷史與圖表 */
        .chart-container {
            position: relative;
            height: 220px;
            width: 100%;
            margin-top: 10px;
        }

        .history-list-item {
            padding: 8px 0;
            border-bottom: 1px solid var(--card-border);
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }

        .finance-summary {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        .finance-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }

        .finance-box .num {
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- 頂部英雄面板 -->
    <header>
        <div class="user-profile">
            <div class="avatar">⚔️</div>
            <div class="user-info">
                <h2><span id="player-name">冒險者</span> <span class="level-badge" id="player-level">LV.1</span></h2>
                <div class="currencies">
                    <div class="currency-item">🪙 <span id="player-gold">0</span> 金幣</div>
                </div>
            </div>
        </div>
        <div class="stats-bar">
            <div class="bar-label">
                <span>經驗值 EXP</span>
                <span id="exp-text">0 / 100</span>
            </div>
            <div class="progress-bg">
                <div class="progress-fill" id="exp-bar"></div>
            </div>
        </div>
    </header>

    <!-- 主頁面內容區 -->
    <main>
        <!-- 1. 任務與冒險頁面 -->
        <section id="tab-quests" class="tab-content active">
            <div class="card">
                <div class="card-title">➕ 發布新任務</div>
                <input type="text" id="quest-title" placeholder="任務名稱 (例: 練習桌遊設計30分鐘)">
                <div style="display: flex; gap: 8px;">
                    <select id="quest-attr"></select>
                    <input type="number" id="quest-exp" placeholder="EXP (預設20)" value="20">
                    <input type="number" id="quest-gold" placeholder="金幣 (預設10)" value="10">
                </div>
                <button class="btn-primary" onclick="addQuest()">新增任務</button>
            </div>

            <div class="card">
                <div class="card-title">📜 每日任務清單</div>
                <div id="quest-list"></div>
            </div>
        </section>

        <!-- 2. 個人屬性與能力矩陣 -->
        <section id="tab-stats" class="tab-content">
            <div class="card">
                <div class="card-title">
                    ✨ 自訂能力矩陣
                </div>
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <input type="text" id="new-attr-name" placeholder="新增能力 (如: 桌遊設計)" style="margin:0;">
                    <button class="btn-primary" onclick="addCustomAttribute()"
